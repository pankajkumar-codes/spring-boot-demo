spring.application.name=spring-boot-demo
# connectTimeout, loginTimeout and socketTimeout are in seconds. socketTimeout bounds how long a query waits for a
# database that accepts the connection but stops answering (a frozen or overloaded server).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5332}/${DB_NAME:software-engineers}?connectTimeout=${DB_CONNECT_TIMEOUT:2}&loginTimeout=${DB_CONNECT_TIMEOUT:2}&socketTimeout=${DB_SOCKET_TIMEOUT:2}
spring.datasource.username=${DB_USER:software-engineers}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Fail fast when the database is down or stuck (Hikari default is 30 s per request).
# Keep these above the JDBC timeouts so a slow query is cut by the driver first.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000

# Per-client rate limit (token bucket). Clients over the limit get 429 with Retry-After.
# The client is the TCP peer address; X-Forwarded-For is not trusted (clients can forge it).
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-second=${RATE_LIMIT_RPS:50}
app.rate-limit.burst=${RATE_LIMIT_BURST:10}
