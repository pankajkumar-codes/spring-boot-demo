spring.application.name=spring-boot-demo
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5332}/${DB_NAME:software-engineers}
spring.datasource.username=${DB_USER:software-engineers}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Fail fast when the database is down (default is 30 s per request)
spring.datasource.hikari.connection-timeout=3000
